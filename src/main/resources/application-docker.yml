spring:
  application:
    name: ink-ms-reports
  
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/analytics_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3006

jwt:
  # Sin valor por defecto a propósito: si falta la variable el servicio no arranca,
  # en lugar de validar tokens con un secreto conocido.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:3001}

users:
  service:
    url: ${USERS_SERVICE_URL:http://users-service:3002}

sports:
  service:
    url: ${SPORTS_SERVICE_URL:http://sports-service:3003}

accessibility:
  service:
    url: ${ACCESSIBILITY_SERVICE_URL:http://accessibility-service:3004}

feign:
  circuitbreaker:
    enabled: ${FEIGN_CIRCUITBREAKER:true}
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

security:
  basic:
    enabled: false

logging:
  level:
    com.inklusport.reports: ${LOG_LEVEL:DEBUG}

reports:
  scheduling:
    enabled: true
  aggregation:
    cron: "0 0 1 * * ?"
  cleanup:
    cron: "0 0 2 * * SUN"
    retention-days: 90