spring:
  datasource:
    url: jdbc:h2:mem:reports_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test-only-secret-not-used-anywhere-else-padded-to-512-bits-for-HS512-aaaaaaaaaaaa
  expiration: 86400000

reports:
  scheduling:
    enabled: false
