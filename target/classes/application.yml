spring:
  application:
    name: ink-ms-reports
  
  datasource:
    url: jdbc:mysql://localhost:3306/analytics_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtps}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

server:
  port: 3006

jwt:
  secret: ${JWT_SECRET:inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512}
  expiration: ${JWT_EXPIRATION:86400000}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:3001}

users:
  service:
    url: http://localhost:3002

sports:
  service:
    url: http://localhost:3003

accessibility:
  service:
    url: http://localhost:3004

mail:
  enabled: ${MAIL_ENABLED:false}

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000


logging:
  level:
    com.inklusport.reports: DEBUG

reports:
  scheduling:
    enabled: true
  aggregation:
    cron: "0 0 1 * * ?"
  cleanup:
    cron: "0 0 2 * * SUN"
    retention-days: 90
  weekly-email:
    cron: "0 0 8 * * MON"