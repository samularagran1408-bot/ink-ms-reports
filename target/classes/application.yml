spring:
  application:
    name: ink-ms-reports
  
  datasource:
    url: jdbc:mysql://localhost:3306/analytics_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3006

jwt:
  secret: ${JWT_SECRET:inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512}
  expiration: ${JWT_EXPIRATION:86400000}

users:
  service:
    url: http://localhost:3002

sports:
  service:
    url: http://localhost:3003

accessibility:
  service:
    url: http://localhost:3004

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000


logging:
  level:
    com.inklusport.reports: DEBUG

reports:
  scheduling:
    enabled: true
  aggregation:
    cron: "0 0 1 * * ?"
  cleanup:
    cron: "0 0 2 * * SUN"
    retention-days: 90